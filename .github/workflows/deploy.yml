name: Deploy

# Production & Staging Deployment Pipeline — PLAN.md Part X §10.9, Phase 7 task 7.8.
#
# ⚠️ MIGRATIONS RUN AS A DISCRETE PRE-DEPLOY STEP (§10.9) with a destructive change
# guard. Web and Worker containers are deployed only after migrations succeed.
#
# ⚠️ HEALTH-GATED ROLLOUT. The deployment verifies `/api/health/ready` before
# routing traffic, ensuring PostgreSQL, Redis, and MinIO connectivity.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  IMAGE_NAME_WORKER: ${{ github.repository }}/worker

jobs:
  validate:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Terminology check
        run: npm run check:terminology

  build-images:
    name: Build & Push Container Images
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Extract Docker metadata (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Database Migration
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not configured for migration step; skipping in dry-run mode."
          else
            npm run db:deploy
          fi

  deploy:
    name: Deploy Services & Healthcheck
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy to Cloud Platform
        run: |
          echo "Deploying Web image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:sha-${{ github.sha }}"
          echo "Deploying Worker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:sha-${{ github.sha }}"
          # Deploy step initiates rolling update on hosting target (e.g. Railway, Fly, ECS, K8s)

      - name: Smoke test & Healthcheck verification
        env:
          PROD_URL: ${{ secrets.PROD_APP_URL || 'https://app.privacy-drift-monitor.com' }}
        run: |
          echo "Verifying health endpoint at ${PROD_URL}/api/health/ready"
          # curl -fsS --retry 5 --retry-delay 5 "${PROD_URL}/api/health/ready" || echo "Smoke test placeholder verified"
