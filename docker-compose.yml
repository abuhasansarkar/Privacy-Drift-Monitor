# Local development dependencies only.
# In production these are MANAGED services (see PLAN.md Part X §10.9) — only
# `web` and `worker` are containers we build and deploy ourselves.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drift_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drift_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pdm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Console: http://localhost:9001 (minioadmin/minioadmin)
  minio:
    image: minio/minio:latest
    container_name: pdm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the private bucket on first boot, then exits with code 0.
  # Polls instead of using a healthcheck — more reliable across MinIO versions.
  minio-init:
    image: minio/mc:latest
    container_name: pdm-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/drift-monitor;
      mc anonymous set none local/drift-monitor;
      echo 'bucket ready: drift-monitor (private)';
      "

  # Catches all outbound email in development. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: pdm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
