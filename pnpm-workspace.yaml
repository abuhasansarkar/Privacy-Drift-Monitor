# ⚠️ OBSOLETE — DELETE THIS FILE.
#
# This project uses **npm workspaces**, not pnpm. The workspace definition now
# lives in the root package.json under the "workspaces" field.
#
#   rm pnpm-workspace.yaml pnpm-lock.yaml
#
# It is kept here only as a tombstone because the tooling that made the switch
# could not delete files. npm ignores this file entirely; it is inert. The
# settings it used to carry are no longer needed under npm:
#
#   allowBuilds          → npm runs postinstall scripts by default, so Prisma
#                          generates its client without any allowlist.
#   public-hoist-pattern → npm hoists to the root node_modules by default.
#   minimumReleaseAge*   → pnpm-only policy, no npm equivalent.
